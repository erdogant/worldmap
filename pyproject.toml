[build-system]
requires = ["setuptools", "wheel", "d3blocks"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmap"
dynamic = ["version"]
authors = [{ name = "Erdogan Taskesen", email = "erdogant@gmail.com" },]
description = "Python package d3blocks."
readme = "README.md"
requires-python = ">=3"
license = "GPL-3.0-or-later"
keywords = [
    "Python",
    "visualizations",
    "interactive",
    "javascript",
    "d3js",
    "d3blocks",
    "network",
    "graph",
    "data visualization",
    "web",
    "extendable",
    "extension",
    "plugin",
    "modular",
    "customizable"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: Unix",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dependencies = [
    'd3blocks',
]

[project.urls]
Homepage = "https://erdogant.github.io/worldmap"
Download = "https://github.com/erdogant/worldmap/archive/{version}.tar.gz"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["worldmap*"]

[tool.setuptools.dynamic]
version = { attr = "worldmap.__version__" }
